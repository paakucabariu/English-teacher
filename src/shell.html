<title>On Air English</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EDF0F3;--surface:#FFFFFF;--surface-2:#F4F6F8;--ink:#141B24;--muted:#5A6572;--line:#D5DBE1;
  --accent:#C8313F;--accent-ink:#FFFFFF;--accent-soft:#F7DDE0;
  --ok:#0F766C;--ok-soft:#D5EEEA;--warn:#9A5B00;--warn-soft:#F6E7CC;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0E1319;--surface:#161D25;--surface-2:#1C2530;--ink:#E4E9EE;--muted:#94A0AD;--line:#2A3541;
    --accent:#FF5B6C;--accent-ink:#1B090C;--accent-soft:#3A1C23;
    --ok:#46C2B3;--ok-soft:#12302D;--warn:#E3A548;--warn-soft:#33270F;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1319;--surface:#161D25;--surface-2:#1C2530;--ink:#E4E9EE;--muted:#94A0AD;--line:#2A3541;
  --accent:#FF5B6C;--accent-ink:#1B090C;--accent-soft:#3A1C23;
  --ok:#46C2B3;--ok-soft:#12302D;--warn:#E3A548;--warn-soft:#33270F;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:16px 40px;display:flex;flex-direction:column;gap:16px}
.stack{display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:22px}h3{font-size:15px}
p{margin:0}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.note{font-size:14px;color:var(--muted)}
.note.err,.err{color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.small{font-size:14px;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{padding:13px 22px;font-size:16px}
.btn:disabled{opacity:.5;cursor:default}
select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;font-size:15px;max-width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:12px}
.card.err{border-color:var(--accent);color:var(--ink)}
.sec{display:grid;gap:8px}
.sec ul,.card ul{margin:0;padding-left:18px;display:grid;gap:6px}

.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lamp{font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.14em;padding:5px 9px;border:2px solid var(--line);border-radius:6px;color:var(--muted);transition:all .25s}
.lamp.live{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 0 4px var(--accent-soft),0 0 24px var(--accent)}
.top h1{font-size:20px}
.linkish{border:none;background:none;padding:0;text-align:left;color:inherit}
.sync{margin-left:auto;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="server"]{color:var(--ok);border-color:var(--ok)}
.sync[data-s="server"]::before{background:var(--ok)}
.sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="error"]{color:var(--accent);border-color:var(--accent)}
.sync[data-s="error"]::before{background:var(--accent)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}
.stat b{font:500 22px var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);line-height:1.2}
@media (max-width:460px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card.next{border-left:4px solid var(--accent)}
.focus{background:var(--ok-soft);border-radius:10px;padding:10px 12px;font-size:15px}
.phr{display:grid;gap:6px}
.phr div{display:grid}
.phr span{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.spark{width:100%;height:56px;display:block}
.spark .sv{font:500 12px var(--mono);fill:var(--muted)}
.bank{list-style:none;padding:0!important}
.bank li{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.bank s{color:var(--muted)}
.pill{font:500 11px var(--mono);border-radius:999px;padding:2px 8px;border:1px solid var(--accent);color:var(--accent);white-space:nowrap;flex:none;margin-top:2px}
.pill.fixed{border-color:var(--ok);color:var(--ok)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips.multi{flex-wrap:wrap}
.chip{font-size:13px;padding:5px 11px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.used{border-color:var(--ok)}
.chip.own{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.hist{list-style:none;padding:0!important}
.hist button{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;padding:8px 0;border-bottom:1px solid var(--line)}
.hn{font:500 13px var(--mono);color:var(--muted)}
.ht{display:grid}
.ht small{color:var(--muted);font-size:12px}
.hs{font:500 14px var(--mono)}
details.settings{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
details.settings summary{cursor:pointer;font-weight:700}
#settingsBody{display:grid;gap:12px;margin-top:12px}
.field{display:grid;gap:4px;font-size:14px;font-weight:700}
.field select{font-weight:400}

/* lesson */
.stagebar{display:grid;gap:6px}
#stages{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.seg{height:5px;border-radius:3px;background:var(--line)}
.seg.fin{background:var(--ok)}
.seg.cur{background:var(--accent)}
.stagemeta{display:flex;justify-content:space-between;align-items:center;gap:10px}
#stageName{font-weight:700}
#stageTime{font:500 14px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.ai{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:10px;min-height:120px;align-content:start}
#aiText{font-size:clamp(18px,4.6vw,22px);line-height:1.4}
#aiRu{font-size:15px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.tools{display:flex;gap:6px;flex-wrap:wrap}
.tool{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
#hint{background:var(--warn-soft);border-radius:10px;padding:8px 12px;font-size:15px}
#state{font-size:14px;color:var(--muted);min-height:21px}
.answer{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:12px;display:grid;gap:10px}
#answer{width:100%;min-height:96px;border:none;background:transparent;resize:vertical;font-size:17px;line-height:1.45;outline:none}
.answer .row{justify-content:space-between}
#micBtn{width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;padding:0}
#micBtn svg{width:22px;height:22px;fill:currentColor}
#micBtn[data-state="listening"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px var(--accent-soft)}}
.lfoot{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}

/* report */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.score{display:grid;gap:4px;font-size:13px}
.track{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.track i{height:6px;border-radius:2px;background:var(--line)}
.track i.on{background:var(--ok)}
.mist{list-style:none;padding:0!important;display:grid;gap:10px}
.mist li{display:grid;gap:2px;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px solid var(--line)}
.mist s,.mist small{color:var(--muted)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);z-index:10;box-shadow:0 6px 20px rgba(0,0,0,.25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="lamp" id="lamp" aria-hidden="true">ON AIR</div>
    <button class="linkish" id="homeLink"><h1>On Air English</h1></button>
    <span class="sync" id="sync" data-s="local">Сохраняется в браузере</span>
  </header>

  <section id="home" class="stack" hidden>
    <div class="stack" id="homeBody"></div>
    <details class="settings">
      <summary>Настройки</summary>
      <div id="settingsBody"></div>
    </details>
  </section>

  <section id="lesson" class="stack" hidden>
    <div class="stagebar">
      <div id="stages"></div>
      <div class="stagemeta"><span id="stageName"></span><span id="stageTime"></span></div>
    </div>
    <div class="ai" aria-live="polite">
      <p id="aiText"></p>
      <p id="aiRu" hidden></p>
      <div class="tools">
        <button class="tool" id="repeatBtn">↻ Повтори</button>
        <button class="tool" id="slowBtn">Медленнее</button>
        <button class="tool" id="ruBtn">RU перевод</button>
        <button class="tool" id="hintBtn">Не знаю, что сказать</button>
      </div>
      <p id="hint" hidden></p>
    </div>
    <p id="state"></p>
    <button class="btn" id="retryBtn" hidden>Попробовать ещё раз</button>
    <form class="answer" id="answerForm" autocomplete="off">
      <textarea id="answer" rows="3" placeholder="Нажмите сюда, затем 🎤 на клавиатуре и отвечайте голосом по-английски" aria-label="Ваш ответ"></textarea>
      <div class="row">
        <button type="button" id="micBtn" aria-label="Говорить в микрофон браузера" title="Микрофон браузера"><svg viewBox="0 0 16 16"><path d="M8 10a2.5 2.5 0 0 0 2.5-2.5v-4a2.5 2.5 0 0 0-5 0v4A2.5 2.5 0 0 0 8 10zm4-2.5h1A5 5 0 0 1 8.5 12.5V15h-1v-2.5A5 5 0 0 1 3 7.5h1a4 4 0 0 0 8 0z"/></svg></button>
        <button class="btn primary big" id="sendBtn">Отправить</button>
      </div>
    </form>
    <div>
      <span class="label">Фразы урока · нажмите, чтобы послушать</span>
      <div class="chips" id="chips"></div>
    </div>
    <div class="lfoot">
      <button class="btn" id="skipBtn">Следующий этап →</button>
      <button class="btn" id="endBtn">Закончить</button>
    </div>
  </section>

  <section id="report" class="stack" hidden>
    <div class="stack" id="reportBody"></div>
  </section>
</div>
<div id="toast" role="status" hidden></div>
